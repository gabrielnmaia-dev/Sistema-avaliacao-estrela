<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Avaliação</title>
</head>
<body>

    <header>
        <nav>
            <h3>Avaliação de felinos</h3>
        </nav>
    </header>

    <h1>Bem-vindo à Avaliação</h1>

    <main>
        <div class="container">
            <article class="card">
                <h2>Gato 1</h2>    
                <img src="/src/img/510.jpg" alt="meme de um gato">
                <fieldset class="estrelas" data-gato-id="1">
                    <legend>Avalie este gato</legend>
                    <input type="radio" id="gato1-estrela5" name="avaliacao-gato1" value="5">
                    <label for="gato1-estrela5">
                        <span class="visually-hidden">5 estrelas</span>    
                    </label>
        
                    <input type="radio" id="gato1-estrela4" name="avaliacao-gato1" value="4">
                    <label for="gato1-estrela4">
                        <span class="visually-hidden">4 estrelas</span>
                    </label>
                    
                    <input type="radio" id="gato1-estrela3" name="avaliacao-gato1" value="3">
                    <label for="gato1-estrela3">
                        <span class="visually-hidden">3 estrelas</span>
                    </label>
        
                    <input type="radio" id="gato1-estrela2" name="avaliacao-gato1" value="2">
                    <label for="gato1-estrela2">
                        <span class="visually-hidden">2 estrelas</span>
                    </label>
        
                    <input type="radio" id="gato1-estrela1" name="avaliacao-gato1" value="1">
                    <label for="gato1-estrela1">
                        <span class="visually-hidden">1 estrela</span>
                    </label>
                </fieldset>

            </article>

            <article class="card">
                <h2>Gato 2</h2>    
                <img src="/src/img/409.jpg" alt="meme de um gato">
                <fieldset class="estrelas" data-gato-id="2">
                    <legend>Avalie este gato</legend>
                    <input type="radio" id="gato2-estrela5" name="avaliacao-gato2" value="5">
                    <label for="gato2-estrela5">5 estrelas</label>
        
                    <input type="radio" id="gato2-estrela4" name="avaliacao-gato2" value="4">
                    <label for="gato2-estrela4">4 estrelas</label>
                    
                    <input type="radio" id="gato2-estrela3" name="avaliacao-gato2" value="3">
                    <label for="gato2-estrela3">3 estrelas</label>
        
                    <input type="radio" id="gato2-estrela2" name="avaliacao-gato2" value="2">
                    <label for="gato2-estrela2">2 estrelas</label>
        
                    <input type="radio" id="gato2-estrela1" name="avaliacao-gato2" value="1">
                    <label for="gato2-estrela1">1 estrela</label>
                </fieldset>

            </article>

        </div>
    </main>
<script src="src/script.js"></script>       
</body>
</html>
